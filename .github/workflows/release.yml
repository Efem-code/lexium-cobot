# Builds LexiumCobot.exe and publishes it as a GitHub Release.
#   Release:  git tag v1.0.0 && git push origin v1.0.0
#   Test build only (no release): Actions tab > "Build Windows app" > Run workflow
name: Build Windows app
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests
        run: |
          python -m tests.test_e2e
          python -m tests.test_sdk
      - name: Build exe
        run: |
          python -m pip install pyinstaller
          pyinstaller --noconfirm --onefile --name LexiumCobot --icon packaging/icon.ico --paths . --add-data "cobot/static;cobot/static" packaging/exe_entry.py
          dist\LexiumCobot.exe --version
      - uses: actions/upload-artifact@v4
        with:
          name: LexiumCobot-windows
          path: dist/LexiumCobot.exe
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" dist/LexiumCobot.exe \
            --title "Lexium Cobot $GITHUB_REF_NAME" \
            --notes "Download **LexiumCobot.exe** and double-click it: the simulator and controller page open in your browser. No Python needed. Windows may warn that the app is from an unknown publisher (it isn't code-signed): More info > Run anyway. See the README for connecting to the real cobot, the iPad bridge and the Python SDK."
